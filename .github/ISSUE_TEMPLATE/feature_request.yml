name: Feature Request
description: 提出新功能建议或交互优化想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景与痛点
      description: 描述你希望解决什么问题，或在什么使用场景下需要这个能力。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你期望的交互方式、界面形态或行为细节。
    validations:
      required: true
